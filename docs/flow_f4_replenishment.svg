<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>F4 Replenishment flow (day 26 + branch) - specification schema</title>
  <rect width="760" height="560" fill="#F2EFE9"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#0B0B0B">F4 Replenishment: day 26 + "still have some?" branch</text>
  <text x="24" y="52" fill="#52514E">Specification schema (not a screenshot of any account). SIMULATED brand "Brand G".</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52514E"/></marker></defs>
  <g stroke="#52514E" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M380 104 V128"/><path d="M380 172 V196"/><path d="M380 240 V264"/><path d="M380 308 V330"/>
    <path d="M300 352 H196 V384"/><path d="M460 352 H564 V384"/><path d="M564 428 V452"/>
  </g>
  <g>
    <rect x="230" y="68" width="300" height="36" rx="8" fill="#2A78D6"/>
    <text x="380" y="91" text-anchor="middle" fill="#fff" font-weight="600">Trigger: Placed Order (30-serving jar, one-off)</text>
    <rect x="230" y="128" width="300" height="44" rx="8" fill="#fff" stroke="#E1DDD4"/>
    <text x="380" y="146" text-anchor="middle" fill="#0B0B0B">Flow filters: no order since trigger;</text>
    <text x="380" y="163" text-anchor="middle" fill="#0B0B0B">not an active subscriber; email consent</text>
    <rect x="230" y="196" width="300" height="44" rx="8" fill="#fff" stroke="#E1DDD4"/>
    <text x="380" y="214" text-anchor="middle" fill="#0B0B0B">Random split: 10 % holdout (no email)</text>
    <text x="380" y="231" text-anchor="middle" fill="#52514E">90 % continue</text>
    <rect x="230" y="264" width="300" height="44" rx="8" fill="#fff" stroke="#E1DDD4"/>
    <text x="380" y="282" text-anchor="middle" fill="#0B0B0B">Time delay: 26 days</text>
    <text x="380" y="299" text-anchor="middle" fill="#52514E">smart sending on; skip if a campaign went out in 24 h</text>
    <rect x="300" y="330" width="160" height="44" rx="8" fill="#FBE9E0" stroke="#E1DDD4"/>
    <text x="380" y="349" text-anchor="middle" fill="#9A3B12" font-weight="600">Email R1</text>
    <text x="380" y="366" text-anchor="middle" fill="#9A3B12">"About 4 servings left?"</text>
    <rect x="86" y="384" width="220" height="60" rx="8" fill="#fff" stroke="#E1DDD4"/>
    <text x="196" y="406" text-anchor="middle" fill="#0B0B0B">Clicked "Reorder" or ordered</text>
    <text x="196" y="424" text-anchor="middle" fill="#52514E">-> exit flow (order placed)</text>
    <rect x="444" y="384" width="240" height="44" rx="8" fill="#fff" stroke="#E1DDD4"/>
    <text x="564" y="402" text-anchor="middle" fill="#0B0B0B">Conditional split: clicked</text>
    <text x="564" y="419" text-anchor="middle" fill="#0B0B0B">"I still have some" (profile property)</text>
    <rect x="444" y="452" width="240" height="60" rx="8" fill="#FBE9E0" stroke="#E1DDD4"/>
    <text x="564" y="474" text-anchor="middle" fill="#9A3B12" font-weight="600">Delay 7 days -> Email R2 (day 33)</text>
    <text x="564" y="492" text-anchor="middle" fill="#9A3B12">"Your reminder, as promised"</text>
  </g>
  <text x="24" y="540" fill="#52514E" font-size="12">Exit on any order. KPI: 60-day repurchase and CM per trigger vs holdout. SIMULATED A/B: 56.1 % (day 26 + branch) vs 51.5 % (day 21).</text>
</svg>
